apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: registration-app
  template:
    metadata:
      labels:
        app: registration-app
    spec:
      containers:
        - name: registration-app
          image: YOUR_REGISTRY/registration-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: registration-app-config
            - secretRef:
                name: registration-app-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: registration-app
spec:
  selector:
    app: registration-app
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
