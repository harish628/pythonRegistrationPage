apiVersion: apps/v1
kind: Deployment

metadata:
  name: registration-app
  namespace: registration

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: registration-app

  template:
    metadata:
      labels:
        app: registration-app

    spec:

      containers:
        - name: registration-app

          image: 840986438223.dkr.ecr.ap-south-1.amazonaws.com/python-registration:world

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          # Load all variables from ConfigMap and Secret
          envFrom:

            - configMapRef:
                name: registration-app-config

            - secretRef:
                name: registration-app-secret

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL